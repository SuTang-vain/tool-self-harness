# Tool Self-Harness config - DeepSeek-V4-Pro variant
# Uses DeepSeek's native OpenAI-compatible endpoint (api.deepseek.com).
# DeepSeek-V4-Pro is a reasoning model (has reasoning_content like GLM-5.2).
target:
  kind: skill
  skill_repo: /Users/tangyaoyue/DEV/sg-data-pack
  skill_name: sg-data-pack
  skill_entry: SKILL.md

model:
  provider_id: "92969444-8684-41e1-8b86-936cf6697c35"
  model: deepseek-v4-pro
  # api_key read from ~/.zcode/v2/config.json automatically
  temperature: 0
  max_tokens: 8192

loop:
  rounds: 1
  proposals_per_round: 2
  max_steps_per_task: 24
  eval_repeats: 2

paths:
  tasks_held_in: tasks/held-in
  tasks_held_out: tasks/held-out
  sandbox: sandbox
  lineage: lineage
  runs: runs
  evidence: evidence
  proposals: proposals
  results: results
