# Broken preset fixture ec-02: consumer (compaction-basic) left outside the
# group realm that provides toolResultPruner -> row never activates.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
