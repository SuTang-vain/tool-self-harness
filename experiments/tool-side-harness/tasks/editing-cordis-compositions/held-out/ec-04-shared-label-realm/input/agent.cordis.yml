# Broken preset fixture ec-04: isolate realm declared with a string label
# instead of `true` — a label joins subtrees into one shared realm and
# provide() still collides on the second registration.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflows: shared
  config:
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
