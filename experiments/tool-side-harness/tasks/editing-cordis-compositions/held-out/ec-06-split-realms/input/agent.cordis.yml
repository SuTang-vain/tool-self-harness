# Broken preset fixture ec-06: the workflow realm is split — the provider sits
# in one group, the consumer in a realm of its own, so the consumer never
# activates.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflows: true
  config:
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

- id: workflows-consumer
  name: cordis:group
  group: true
  isolate:
    workflows: true
  config:
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
