# Broken preset fixture ec-07: the pruner publishes toolResultPruner into the
# root realm AND the compaction consumer is loose.
- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
