# Tool Self-Harness config - MiniMax-M3 variant
# Uses MiniMax-M3's OpenAI-compatible endpoint at /v1/chat/completions
# (api.minimaxi.com exposes both /v1/chat/completions and /anthropic/v1/messages).
# Everything else (tasks, surfaces, lineage) is identical to config.yaml.
target:
  kind: skill
  skill_repo: /Users/tangyaoyue/DEV/sg-data-pack
  skill_name: sg-data-pack
  skill_entry: SKILL.md

model:
  provider_id: "ba8ce0fd-47c2-43f6-8526-0834a3869215"
  model: MiniMax-M3
  # The ZCode provider stores baseURL https://api.minimaxi.com/anthropic, but
  # the OpenAI-format endpoint /v1/chat/completions lives at the root. Override:
  base_url: https://api.minimaxi.com/v1
  # api_key is read from ~/.zcode/v2/config.json automatically.
  temperature: 0
  max_tokens: 8192

loop:
  rounds: 1
  proposals_per_round: 2
  max_steps_per_task: 24
  eval_repeats: 2

paths:
  tasks_held_in: tasks/held-in
  tasks_held_out: tasks/held-out
  sandbox: sandbox
  lineage: lineage
  runs: runs
  evidence: evidence
  proposals: proposals
  results: results
