# Editable surfaces for sg-data-pack SKILL.md
# Each surface is a bounded edit target. A proposal MUST bind to exactly one
# surface_id, and patch.js only modifies the bytes within that surface's bounds.
#
# type:
#   frontmatter-field - a single YAML field in the frontmatter
#   body-section      - a markdown section from its heading to the next heading
#                        of the same or higher level (or EOF)
#
# edit_kinds: what the proposer is allowed to do
#   trim          - remove redundant content
#   rewrite       - replace the content (keep intent)
#   add-instruction - append a targeted instruction
#   reorder       - change ordering of items
#   remove        - delete the section entirely

surfaces:
  - id: skill-description
    file: SKILL.md
    type: frontmatter-field
    field: description
    edit_kinds: [rewrite]

  - id: core-concept
    file: SKILL.md
    type: body-section
    heading: "## Core Concept"
    edit_kinds: [trim, rewrite]

  - id: cli-section
    file: SKILL.md
    type: body-section
    heading: "## CLI"
    edit_kinds: [trim, rewrite, reorder]

  - id: workflow-section
    file: SKILL.md
    type: body-section
    heading: "## Workflow"
    edit_kinds: [trim, rewrite, add-instruction]

  - id: rule-cheat-sheet
    file: SKILL.md
    type: body-section
    heading: "## Rule Cheat Sheet"
    edit_kinds: [trim, rewrite, remove]

  - id: crawl-pipeline-contract
    file: SKILL.md
    type: body-section
    heading: "## Crawl-Pipeline Contract"
    edit_kinds: [trim, rewrite]

  - id: deep-references
    file: SKILL.md
    type: body-section
    heading: "## Deep References"
    edit_kinds: [trim, reorder]

  # ---- reference files (on-demand loaded, editable as whole files) ----
  - id: ref-data-pack-contract
    file: references/data-pack-contract.md
    type: whole-file
    edit_kinds: [trim, rewrite, add-instruction]

  - id: ref-extraction-config
    file: references/extraction-config.md
    type: whole-file
    edit_kinds: [trim, rewrite, add-instruction]

  - id: ref-engine-integration
    file: references/engine-integration.md
    type: whole-file
    edit_kinds: [trim, rewrite, add-instruction]

  - id: ref-data-rules-guide
    file: references/data-rules-guide.md
    type: whole-file
    edit_kinds: [trim, rewrite, add-instruction]
